name: Inventory Sync

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run inventory sync
        env:
          ONEAL_FTP_HOST: ${{ secrets.ONEAL_FTP_HOST }}
          ONEAL_FTP_USER: ${{ secrets.ONEAL_FTP_USER }}
          ONEAL_FTP_PASSWORD: ${{ secrets.ONEAL_FTP_PASSWORD }}
          ONEAL_FTP_FILE: '/download/inventories_12019_ONeal_Europe.csv'
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          python inventory_sync.py
